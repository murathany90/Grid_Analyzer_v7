name: Full model acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and LFS model fixture
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture lint
        run: npm run lint
      - name: Unit and regression tests
        run: npm test
      - name: Run full DGS acceptance
        run: npm run test:full
