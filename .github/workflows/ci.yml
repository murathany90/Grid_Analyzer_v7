name: CI

on:
  push:
    branches: [main, feature/psse-ac-dc-busbranch-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Keep the image and version guard in sync with package-lock.json.
    # Browsers, fonts and shared libraries are baked in; no per-run apt downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_IMAGE_VERSION: '1.63.0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out source without large model files
        uses: actions/checkout@v4
        with:
          lfs: false
      # Container root differs from the runner checkout owner; trust only this workspace.
      - name: Trust checked-out workspace inside container
        timeout-minutes: 1
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        timeout-minutes: 3
        run: npm ci
      - name: Typecheck
        timeout-minutes: 2
        run: npm run typecheck
      - name: Architecture lint
        timeout-minutes: 2
        run: npm run lint
      - name: Unit and regression tests
        timeout-minutes: 3
        run: npm test
      - name: Verify preinstalled Chromium matches lockfile
        timeout-minutes: 1
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const locked = require('./package-lock.json').packages;
          const version = require('playwright/package.json').version;
          assert.equal(version, process.env.PLAYWRIGHT_IMAGE_VERSION, 'Update the pinned container when Playwright changes');
          assert.equal(version, locked['node_modules/playwright'].version);
          assert.equal(version, locked['node_modules/playwright-core'].version);
          const executable = require('playwright').chromium.executablePath();
          fs.accessSync(executable, fs.constants.X_OK);
          console.log('PREINSTALLED_CHROMIUM OK', {version, executable});
          NODE
      - name: Browser smoke
        timeout-minutes: 8
        env:
          GA_DESKTOP_ONLY: '1'
        run: npm run test:e2e
      - name: Build standard app
        timeout-minutes: 3
        run: npm run build
      - name: Build portable app
        timeout-minutes: 3
        run: npm run build:portable
      # The committed portable artifact is hashed byte-for-byte, so CI must compare raw
      # bytes, not text. A CRLF checkout would previously produce different bytes and this
      # gate is what makes that impossible to merge silently.
      - name: Verify committed portable bytes match the CI build
        timeout-minutes: 1
        run: |
          set -euo pipefail
          built_sha=$(sha256sum dist-portable/GridAnalyzer_v7.html | cut -d' ' -f1)
          committed_sha=$(git show HEAD:dist-portable/GridAnalyzer_v7.html | sha256sum | cut -d' ' -f1)
          echo "built     $built_sha"
          echo "committed $committed_sha"
          if [ "$built_sha" != "$committed_sha" ]; then
            echo "::error::COMMITTED_PORTABLE_BYTES mismatch: CI build $built_sha != committed $committed_sha"
            exit 1
          fi
          # The artifact must also be LF-only, so no platform can reintroduce CRLF.
          if grep -qU $'\r' dist-portable/GridAnalyzer_v7.html; then
            echo "::error::PORTABLE_CONTAINS_CRLF: the artifact must be LF-only"
            exit 1
          fi
          echo "COMMITTED_PORTABLE_BYTES OK ($built_sha)"
      - name: Upload portable build
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: ytbs-v7-portable
          path: dist-portable/
          if-no-files-found: error
          retention-days: 14
