name: PSS-E SDK V3 portable
on:
  push:
    branches: [fix/psse-import-fidelity-v3]
    paths:
      - tools/psse-import-sdk-v3/ga_psse_sdk/**
      - tools/psse-import-sdk-v3/tests/**
      - tools/psse-import-sdk-v3/integration/**
      - tools/psse-import-sdk-v3/requirements-test.txt
      - .github/workflows/psse-sdk-v3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/psse-import-sdk-v3
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_ga_types.py --ga-root ../..
      - run: npm exec --yes --package=typescript@7.0.2 -- tsc --ignoreConfig --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler integration/canonical-guard.ts runtime/canonical-guard.native.ts
      - run: node --check test_ui/app.js
